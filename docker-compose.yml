# ===== [New File] According to Word Document Section 2.2, Container Orchestration Configuration =====
# Docker Compose Optional Optimization: For multi-container management and resource limits

version: '3.8'
services:
  campus-bot:
    # ===== [According to Document Section 2.1] Build using Dockerfile =====
    build: .
    container_name: campus-telegram-bot
    env_file: .env
    restart: always
    
    # ===== [According to Document Optional Optimization] Resource Limits (Prevent container from consuming excessive resources, cost & stability control) =====
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    
    networks:
      - bot-net
    
    # ===== [Optional Optimization] Container Health Check =====
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== [According to Document Optional Optimization] Redis Cache (Improve Performance) =====
  redis:
    image: redis:alpine
    container_name: bot-redis
    restart: always
    networks:
      - bot-net
    # Redis data persistence
    volumes:
      - redis-data:/data

networks:
  bot-net:
    driver: bridge

volumes:
  redis-data:
