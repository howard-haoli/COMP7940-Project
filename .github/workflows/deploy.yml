# ===== [New File] According to Word Document Section 7.1, GitHub Actions Configuration =====
# CI/CD Automated Deployment: DevOps best practices, automated testing and deployment process

name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== [New Step] Code format check (optional optimization) =====
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      # ===== [According to Document Section 7.1] Sync code to EC2 =====
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          # Use GitHub Secrets (configured according to document section 7.2)
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TELEGRAM_BOT_TOKEN,LLM_API_KEY,DB_HOST,DB_PASSWORD

          # ===== [According to Document Section 7.1] Deployment script =====
          script: |
            cd /home/ec2-user/chatbot_project_comp7940/COMP7940-Project
            git pull origin main

            # Require chatbot_project.tar to be present; load and run image from tar
            if [ -f chatbot_project.tar ]; then
              echo "Found chatbot_project.tar — loading image..."
              LOAD_OUTPUT=$(docker load -i chatbot_project.tar 2>&1)
              echo "$LOAD_OUTPUT"
              IMAGE=$(echo "$LOAD_OUTPUT" | awk -F': ' '/Loaded image/ {print $2}')
              if [ -z "$IMAGE" ]; then
                echo "Could not detect image name from docker load output. Exiting."
                exit 1
              fi

              echo "Stopping and removing existing container (if any) and running new container from image: $IMAGE"
              docker rm -f chatbot_project_container || true
              docker run -d --restart unless-stopped --name chatbot_project_container -p 80:80 "$IMAGE"
            else
              echo "chatbot_project.tar not found — aborting deployment."
              exit 1
            fi

            echo "✓ Deployment completed! Campus Assistant Bot has started"
