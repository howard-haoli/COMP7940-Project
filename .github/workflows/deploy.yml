# ===== [新增文件] 根据Word文档第7.1节，GitHub Actions配置 =====
# CI/CD自动部署：DevOps最佳实践，自动化测试和部署流程

name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== [新增步骤] 代码格式检查（可选优化） =====
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      # ===== [根据文档第7.1节] 同步代码到EC2 =====
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          # 使用GitHub Secrets（根据文档第7.2节配置）
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TELEGRAM_BOT_TOKEN,LLM_API_KEY,DB_HOST,DB_PASSWORD
          
          # ===== [根据文档第7.1节] 部署脚本 =====
          script: |
            cd /home/ec2-user/campus-assistant-bot
            git pull origin main
            
            # 重建容器并启动
            docker-compose down
            docker-compose up -d --build
            
            echo "✓ 部署完成！校园助手机器人已启动"
