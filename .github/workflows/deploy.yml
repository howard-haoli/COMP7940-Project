# ===== [New File] According to Word Document Section 7.1, GitHub Actions Configuration =====
# CI/CD Automated Deployment: DevOps best practices, automated testing and deployment process

name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== [New Step] Code format check (optional optimization) =====
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      # ===== [According to Document Section 7.1] Sync code to EC2 =====
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          # Use GitHub Secrets (configured according to document section 7.2)
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TELEGRAM_BOT_TOKEN,LLM_API_KEY,DB_HOST,DB_PASSWORD

          # ===== [According to Document Section 7.1] Deployment script =====
          script: |
            cd /home/ec2-user/campus-assistant-bot
            git pull origin main

            # Rebuild container and start
            docker-compose down
            docker-compose up -d --build

            echo "✓ Deployment completed! Campus Assistant Bot has started"
